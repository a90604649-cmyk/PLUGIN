plugins {
    id 'java'
}

group = 'com.savagepvp'
version = '1.0.0'

// The project is built with Java 21, but the generated bytecode targets Java 8.
// This lets the same JAR run on Java 8 and on newer JVMs such as Java 21.
def targetJava = 8

def buildJava = 21

repositories {
    mavenCentral()
    maven {
        url = 'https://hub.spigotmc.org/nexus/content/groups/public/'
    }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT'
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(buildJava)
    }
}

processResources {
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

jar {
    archiveFileName = 'SavagePvP-Prueba-' + project.version + '.jar'
    // Bundle the SQLite JDBC driver so the plugin has no runtime dependency to install.
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = targetJava
}
